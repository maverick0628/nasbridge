name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This repo is public, so pull_request runs are triggerable
# by anyone with a fork — no job here should hold a write token or see a secret.
# If a publish job is ever added, scope its permissions to that job alone rather
# than raising them here.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # The test script runs .ts files directly via --experimental-strip-types,
          # which arrived in Node 22.6. That is a constraint on the test harness, not
          # on the shipped package — the `runtime` job below proves the floor.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  runtime:
    # Two claims are checked here, both of which have already been wrong once.
    #
    # 1. package.json says `engines: >=18`, and @modelcontextprotocol/sdk agrees.
    #    Nothing was verifying it, and the test job cannot — it needs 22.6+.
    # 2. zod is imported by src/ but was once declared only as a devDependency,
    #    where it resolved by accident through the MCP SDK's own copy. That works
    #    under npm hoisting and breaks under a strict layout such as pnpm's.
    #
    # Building, then reinstalling with --omit=dev, then importing the built server
    # on the floor version catches both.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Reinstall without dev dependencies
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Every runtime import must resolve
        run: node --input-type=module -e "await import('./dist/index.js'); console.log('runtime imports OK on node ' + process.version)"
